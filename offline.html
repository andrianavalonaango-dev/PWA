<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>offline</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background-color: var(--card-bg);
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      width: 100%;
      max-width: 500px;
      border: 1px solid var(--border);
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      color: var(--text);
      text-align: center;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      font-size: 0.9rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    button {
      width: 100%;
      padding: 0.75rem;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    .result {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 6px;
      background-color: #f1f5f9;
      font-size: 0.95rem;
      word-break: break-all;
      display: none;
    }

    .result.active {
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Page offline</h1>

    <div class="form-group">
      <label for="userInput">Entrée de test :</label>
      <input type="text" id="userInput" placeholder="Saisissez quelque chose ici...">
    </div>

    <button id="testBtn">Tester</button>

    <div id="resultBox" class="result">
      <strong>Résultat :</strong> <span id="output"></span>
    </div>
  </div>

  <script>
   
    const button = document.getElementById('testBtn');
    const input = document.getElementById('userInput');
    const resultBox = document.getElementById('resultBox');
    const output = document.getElementById('output');

    
    button.addEventListener('click', () => {
      const value = input.value.trim();
      
      if (value === "") {
        output.textContent = "Veuillez entrer une valeur avant de tester.";
      } else {
        output.textContent = `Vous avez saisi : "${value}"`;
      }
      
      resultBox.classList.add('active');
    });

    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        button.click();
      }
    });
  </script>

</body>
</html>
